<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Planning Agents</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#243047;--mu:#7b8498;--bd:#e9ecf4;--ac:#6366f1;--acs:rgba(99,102,241,.1);--ok:rgba(52,211,153,.16);--okt:#0f8a63;--wa:rgba(251,191,36,.2);--wat:#a16207;--dn:rgba(148,163,184,.16);--bad:#e5484d;--bads:rgba(229,72,77,.12);--off:#f0f2f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151d;--card:#1b1f2b;--tx:#e8ebf4;--mu:#9099ad;--bd:#2a3040;--ac:#8b8ff8;--acs:rgba(139,143,248,.14);--okt:#5fe0b0;--wat:#f6d36b;--bad:#ff7b80;--off:#222735}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151d;--card:#1b1f2b;--tx:#e8ebf4;--mu:#9099ad;--bd:#2a3040;--ac:#8b8ff8;--acs:rgba(139,143,248,.14);--okt:#5fe0b0;--wat:#f6d36b;--bad:#ff7b80;--off:#222735}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;padding:18px;max-width:1400px;margin:0 auto}
h1{font-size:22px;margin:0;letter-spacing:-.3px}h2{font-size:15px;margin:26px 0 10px;font-weight:650}
.mu{color:var(--mu);font-size:12px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.live{display:inline-flex;align-items:center;gap:6px;background:var(--ok);color:var(--okt);border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600}
.live.m{background:var(--wa);color:var(--wat)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 11px}
button{cursor:pointer;transition:background .15s}button:hover{background:var(--acs)}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px}
.tabs button.a{background:var(--acs);border-color:var(--ac);color:var(--ac);font-weight:650}
.tl{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
.tl input[type=range]{flex:1;min-width:200px;padding:0;accent-color:var(--ac)}
.tm{font-size:26px;font-weight:700;letter-spacing:-1px;min-width:74px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.st div{border-radius:14px;padding:10px 14px}.st b{display:block;font-size:24px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.col h3{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between}
.r{padding:9px 0;border-top:1px solid var(--bd)}.r:first-of-type{border-top:0}
.r .n{font-weight:600}
.bg{height:6px;background:var(--dn);border-radius:9px;margin:6px 0 2px;overflow:hidden}.bg i{display:block;height:100%;background:var(--ac);opacity:.6;border-radius:9px}
.z{display:inline-flex;align-items:center;gap:5px;border:1px solid;border-radius:99px;padding:1px 9px 1px 6px;font-size:11px;font-weight:550;color:var(--tx);margin-top:3px}
.z:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11px;font-weight:600}
.grp{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:12px}
.w{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:1000px}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--mu);font-weight:600}
td.o{background:var(--off);color:var(--mu);text-align:center;vertical-align:middle;font-weight:600;font-size:12px}
.c select{padding:3px 5px;font-size:12px;font-weight:600;width:100%;border-radius:8px}
.ag{white-space:nowrap}.ag button{padding:0 7px;margin:3px 3px 0 0;font-size:12px}
.bad{color:var(--bad);font-weight:700}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.cv table{min-width:800px}.cv td,.cv th{text-align:center;padding:5px 3px;font-size:12px}
.cur{box-shadow:inset 0 0 0 2px var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
</style></head><body>
<div class="top"><div><h1>Planning des agents</h1><div class="mu">44h/semaine · 09:00 → 02:00 · Ven/Sam 8h, autres jours 7h · sans pause · OFF du Lundi au Jeudi</div></div>
<div><span id="lv" class="live"></span></div></div>

<div class="tabs" id="tabs"></div>
<div class="card"><div class="tl"><div class="tm" id="tm"></div><input type="range" id="sl" min="9" max="26" step="0.25" oninput="setT(this.value)"><button onclick="goLive()">● Maintenant</button></div>
<div class="st" id="st"></div>
<div class="cols" id="cols"></div></div>
<div class="grp" id="grp"></div>

<h2>Gestion</h2>
<div class="bar"><input id="nn" placeholder="Nom de l’agent"><button class="p" onclick="add()">+ Ajouter un agent</button>
<button onclick="S.week++;save()">↻ Régénérer la rotation</button>
<button onclick="S.ov={};save()">Effacer les horaires manuels</button>
<button onclick="if(confirm('Tout réinitialiser ?')){S=def();save()}">Réinitialiser</button></div>
<div class="lg" id="lg"></div>
<div class="w"><table id="t"></table></div>

<h2>Couverture par heure</h2>
<div class="mu" style="margin-bottom:8px">Total en gras, puis agents dans Groupe A · B · C (0 en rouge = groupe non couvert). Rush : 12h–15h et 18h–01h.</div>
<div class="w cv"><table id="cv"></table></div>

<script>
var DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
var ZONES=[["McDo Medina","#8b5cf6"],["McDo Bouragrag","#a78bfa"],["McDo Hay Chaou","#d946ef"],["McDo Carrousel","#38bdf8"],["McDo LGV","#2dd4bf"],["McDo Agdal","#60a5fa"],["Le Marché","#fb7185"],["McDo Temara","#fb923c"],["McDo Hay Riad","#f5b53d"]];
var CL=["#8b5cf6","#38bdf8","#fb923c"],GN=["A","B","C"];
var NAMES=["Yahya Rhallah","Youssef Derkaoui","Aymane Chlifane","Achraf Akhlij","Islam Elmardi","Oussama El Atrach","Mehdi Ait Jebour","Mourad Cherradi","Ayoub Abssi","Hassan Azgoune","Ayoub Ben Malek","Charaf Loummihi","Mohamd Khalyl"];
function def(){return{agents:NAMES.map(function(n,i){return{id:i+1,n:n,off:i%4}}),ov:{},week:0,nid:100}}
var S=def(),PLAN=[],live=true,sel=0,tm=12;
try{var r=localStorage.getItem("pl1");if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem("pl1",JSON.stringify(S))}catch(e){}render()}
function L(d){return d==4||d==5?8:7}
function fmt(h){h=h%24;return(h<10?"0":"")+h+":00"}
function ft(t){var h=Math.floor(t),m=Math.round((t-h)*60);if(m==60){h++;m=0}h=h%24;return(h<10?"0":"")+h+":"+(m<10?"0":"")+m}
function dur(x){var m=Math.round(x*60),h=Math.floor(m/60);m=m%60;return(h?h+"h":"")+(m?(h?(m<10?"0":""):"")+m+(h?"":" min"):"")}
function add(){var v=document.getElementById("nn").value.trim();if(!v)return;S.agents.push({id:S.nid++,n:v,off:S.agents.length%4});save()}
function del(i){S.agents.splice(i,1);save()}
function mv(i,k){var j=i+k,a=S.agents;if(j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t;save()}
function setOff(i,v){S.agents[i].off=+v;save()}
function setOv(id,d,v){S.ov[id+"-"+d]=+v;save()}
function chip(z){var c=ZONES[z][1];return"<span class='z' style='background:"+c+"26;border-color:"+c+"80;color:"+c+"'><span style='color:var(--tx)'>"+ZONES[z][0]+"</span></span>"}
function gen(){
 var A=S.agents,plan=[],pS={},pZ={},hist={};
 A.forEach(function(a){hist[a.id]={}});
 for(var d=0;d<7;d++){
  var act=A.filter(function(a){return a.off!==d}),n=act.length,l=L(d),day={};
  if(!n){plan.push(day);continue}
  var M=[12,14,16,18,18,10,12,18],slots=[9,19,9,19,9,19].slice(0,n);for(var m=0;slots.length<n;m++)slots.push(M[m%M.length]);slots.sort(function(a,b){return a-b});slots=slots.map(function(v){return Math.min(v,26-l)});
  var o=(d*3+S.week*5)%n,st={};
  act.forEach(function(a,j){st[a.id]=slots[(j+o)%n]});
  act.forEach(function(a){
   if(st[a.id]===pS[a.id]){
    for(var k=0;k<act.length;k++){var b=act[k];
     if(b!==a&&st[b.id]!==pS[a.id]&&st[a.id]!==pS[b.id]&&st[b.id]!==st[a.id]){var t=st[a.id];st[a.id]=st[b.id];st[b.id]=t;break}}}
  });
  act.forEach(function(a){var v=S.ov[a.id+"-"+d];if(v)st[a.id]=Math.min(v,26-l)});
  var ord=act.slice().sort(function(a,b){return st[a.id]-st[b.id]}),ZC=[],CC=[[],[],[]];
  ord.forEach(function(a,j){
   var s0=st[a.id],e0=s0+l,best=0,bs=1e9,q;
   for(var z=0;z<9;z++){
    var c0=Math.floor(z/3),sc=(z===pZ[a.id]?1e6:0)+(hist[a.id][z]||0)*3+((z-j-d+90)%9)*0.1;
    for(q=s0;q<e0;q++){var zn=(ZC[z]&&ZC[z][q])||0,cn=CC[c0][q]||0;sc+=zn*3+cn+(cn===0?-20:0)}
    if(sc<bs){bs=sc;best=z}}
   if(!ZC[best])ZC[best]=[];
   for(q=s0;q<e0;q++){ZC[best][q]=(ZC[best][q]||0)+1;CC[Math.floor(best/3)][q]=(CC[Math.floor(best/3)][q]||0)+1}
   hist[a.id][best]=(hist[a.id][best]||0)+1;
   day[a.id]={s:s0,e:e0,z:best};pZ[a.id]=best;pS[a.id]=s0;
  });
  plan.push(day);
 }
 return plan;
}
function nowInfo(){var n=new Date(),h=n.getHours()+n.getMinutes()/60,d=(n.getDay()+6)%7;if(h<2){h+=24;d=(d+6)%7}return{d:d,t:h}}
function goLive(){live=true;tick()}
function setT(v){live=false;tm=+v;renderLive()}
function setD(d){live=false;sel=d;renderLive()}
function tick(){if(live){var i=nowInfo();sel=i.d;tm=i.t}renderLive()}
setInterval(tick,30000);
function renderLive(){
 var d=sel,t=tm,on=[],soon=[],done=[],off=[];
 S.agents.forEach(function(a){var c=PLAN[d]&&PLAN[d][a.id];
  if(!c){off.push(a);return}
  var o={a:a,c:c};if(t>=c.s&&t<c.e)on.push(o);else if(t<c.s)soon.push(o);else done.push(o)});
 on.sort(function(x,y){return x.c.e-y.c.e});soon.sort(function(x,y){return x.c.s-y.c.s});done.sort(function(x,y){return y.c.e-x.c.e});
 document.getElementById("lv").className="live"+(live?"":" m");
 document.getElementById("lv").textContent=live?"● En direct":"Mode manuel";
 var tb="";DAYS.forEach(function(x,i){tb+="<button class='"+(i===d?"a":"")+"' onclick='setD("+i+")'>"+x+"</button>"});
 document.getElementById("tabs").innerHTML=tb;
 document.getElementById("tm").textContent=ft(t);
 document.getElementById("sl").value=Math.min(Math.max(t,9),26);
 document.getElementById("st").innerHTML=
  "<div style='background:var(--ok)'><b style='color:var(--okt)'>"+on.length+"</b>En service</div>"+
  "<div style='background:var(--wa)'><b style='color:var(--wat)'>"+soon.length+"</b>Pas encore commencé</div>"+
  "<div style='background:var(--dn)'><b>"+done.length+"</b>Terminé</div>"+
  "<div style='background:var(--off)'><b>"+off.length+"</b>OFF aujourd’hui</div>";
 var h1="",h2="",h3="";
 on.forEach(function(o){var p=Math.round((t-o.c.s)/(o.c.e-o.c.s)*100);
  h1+="<div class='r'><div class='n'>"+o.a.n+"</div>"+chip(o.c.z)+"<div class='bg'><i style='width:"+p+"%'></i></div><div class='mu'>"+ft(o.c.s)+" → "+ft(o.c.e)+" · reste "+dur(o.c.e-t)+"</div></div>"});
 soon.forEach(function(o){var w=o.c.s-t;
  h2+="<div class='r'><div class='n'>"+o.a.n+(w<=1?" <span class='badge' style='background:var(--wa);color:var(--wat)'>Bientôt</span>":"")+"</div>"+chip(o.c.z)+"<div class='mu'>Commence à "+ft(o.c.s)+" (dans "+dur(w)+") · fini à "+ft(o.c.e)+"</div></div>"});
 done.forEach(function(o){h3+="<div class='r'><div class='n'>"+o.a.n+"</div>"+chip(o.c.z)+"<div class='mu'>"+ft(o.c.s)+" → "+ft(o.c.e)+" · terminé</div></div>"});
 var em="<div class='mu'>Personne</div>",offh=off.map(function(a){return a.n}).join(", ");
 document.getElementById("cols").innerHTML=
  "<div class='col'><h3>🟢 En service <span class='mu'>"+on.length+"</span></h3>"+(h1||em)+"</div>"+
  "<div class='col'><h3>🟡 Pas encore commencé <span class='mu'>"+soon.length+"</span></h3>"+(h2||em)+"</div>"+
  "<div class='col'><h3>⚪ Terminé <span class='mu'>"+done.length+"</span></h3>"+(h3||em)+(offh?"<div class='mu' style='margin-top:12px'><b>OFF :</b> "+offh+"</div>":"")+"</div>";
 var g="";
 for(var k=0;k<3;k++){
  var m=on.filter(function(o){return Math.floor(o.c.z/3)===k}),b;
  if(!m.length)b="<span class='badge' style='background:var(--bads);color:var(--bad)'>Non couvert</span>";
  else if(m.length<3)b="<span class='badge' style='background:var(--wa);color:var(--wat)'>"+m.length+" agent"+(m.length>1?"s":"")+" : zones couvertes ensemble</span>";
  else b="<span class='badge' style='background:var(--ok);color:var(--okt)'>Chaque zone a son agent</span>";
  g+="<div class='card' style='border-top:4px solid "+CL[k]+"88'><div style='display:flex;justify-content:space-between;align-items:center'><b>Groupe "+GN[k]+"</b>"+b+"</div><div class='mu' style='margin:4px 0 6px'>"+ZONES[k*3][0]+" · "+ZONES[k*3+1][0]+" · "+ZONES[k*3+2][0]+"</div>"+
   (m.map(function(o){return"<div style='margin-top:4px'>"+o.a.n+" "+chip(o.c.z)+"</div>"}).join("")||"")+"</div>";
 }
 document.getElementById("grp").innerHTML=g;
 renderCv();
}
function renderCv(){
 var v="<tr><th>Jour</th>";
 for(var x=9;x<26;x++){var rush=(x>=12&&x<15)||(x>=18&&x<25);v+="<th style='color:"+(rush?"var(--ac)":"var(--mu)")+"'>"+(x%24)+"h</th>"}
 v+="</tr>";
 for(var d=0;d<7;d++){
  v+="<tr><th>"+DAYS[d]+"</th>";
  for(var x=9;x<26;x++){
   var n=0,cc=[0,0,0];for(var id in PLAN[d]){var c=PLAN[d][id];if(c.s<=x&&x<c.e){n++;cc[Math.floor(c.z/3)]++}}
   var rush=(x>=12&&x<15)||(x>=18&&x<25),cur=(d===sel&&Math.floor(tm)===x);
   v+="<td class='"+(cur?"cur":"")+"' style='background:rgba(99,102,241,"+Math.min(n/10,1)*(rush?0.2:0.07)+")'><b>"+n+"</b><br>"+cc.map(function(k,i){return"<span style='color:"+(k?CL[i]:"var(--bad)")+";font-weight:700'>"+k+"</span>"}).join("·")+"</td>";
  }
  v+="</tr>";
 }
 document.getElementById("cv").innerHTML=v;
}
function render(){
 PLAN=gen();
 var h="<tr><th>Agent</th><th>OFF</th>";
 DAYS.forEach(function(x,d){h+="<th>"+x+" <span class='mu'>("+L(d)+"h)</span></th>"});
 h+="<th>Total</th></tr>";
 S.agents.forEach(function(a,i){
  var tot=0;
  h+="<tr><td class='ag'><b>"+(i+1)+". "+a.n+"</b><br><button onclick='mv("+i+",-1)'>↑</button><button onclick='mv("+i+",1)'>↓</button><button onclick='del("+i+")'>×</button></td>";
  h+="<td><select onchange='setOff("+i+",this.value)'>";
  for(var k=0;k<4;k++)h+="<option value='"+k+"'"+(a.off===k?" selected":"")+">"+DAYS[k]+"</option>";
  h+="<option value='-1'"+(a.off<0?" selected":"")+">Aucun</option></select></td>";
  for(var d=0;d<7;d++){
   var c=PLAN[d][a.id];
   if(!c){h+="<td class='o'>OFF</td>";continue}
   tot+=L(d);
   h+="<td class='c'><select onchange='setOv("+a.id+","+d+",this.value)'>";
   for(var s=9;s<=26-L(d);s++)h+="<option value='"+s+"'"+(s===c.s?" selected":"")+">"+fmt(s)+" → "+fmt(s+L(d))+"</option>";
   h+="</select>"+chip(c.z)+"</td>";
  }
  h+="<td class='"+(tot>44?"bad":"")+"'"+(tot>44?" style='background:var(--bads)'":"")+">"+tot+"h"+(tot>44?" ⚠ +"+(tot-44)+"h":"")+"</td></tr>";
 });
 document.getElementById("t").innerHTML=h;
 var g="";ZONES.forEach(function(z,i){if(i%3==0)g+="<span class='mu' style='width:100%'><b style='color:"+CL[i/3]+"'>Groupe "+GN[i/3]+"</b> : 3 zones proches, couvertes ensemble quand il y a peu d’agents.</span>";g+=chip(i)});
 document.getElementById("lg").innerHTML=g;
 tick();
}
render();
</script></body></html>
