<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planning Shift Management (44H) - Electric Violet</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fbf7ff 0%, #f3e8ff 100%);
      --header-bg: linear-gradient(90deg, #4c1d95 0%, #581c87 50%, #6b21a8 100%);
      --card-bg: #ffffff;
      --border-color: #f3e8ff;
      --border-subtle: #e9d5ff;
      --text-main: #3b0764;
      --text-muted: #6b21a8;
      --text-sub: #86198f;
      
      /* Shift Badges Theme 11 */
      --matin-bg: #ede9fe;
      --matin-txt: #6d28d9;
      --matin-border: #c4b5fd;

      --aprem-bg: #fae8ff;
      --aprem-txt: #86198f;
      --aprem-border: #f0abfc;

      --soir-bg: #e0e7ff;
      --soir-txt: #3730a3;
      --soir-border: #a5b4fc;

      --off-bg: #f8fafc;
      --off-txt: #94a3b8;
      --off-border: #e2e8f0;

      --ok-bg: #dcfce7;
      --ok-txt: #15803d;
      --ok-border: #86efac;

      --alert-bg: #fee2e2;
      --alert-txt: #b91c1c;
      --alert-border: #fca5a5;
    }

    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
    
    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      padding: 24px;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      background: var(--card-bg);
      padding: 18px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(76, 29, 149, 0.08);
      border: 1px solid var(--border-subtle);
      margin-bottom: 22px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #7c3aed, #4c1d95);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }

    .brand-title h1 {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(90deg, #4c1d95, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .brand-title p {
      font-size: 12px;
      color: #7c3aed;
      font-weight: 600;
      margin-top: 2px;
    }

    .week-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #faf5ff;
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
    }

    .week-nav span {
      font-weight: 700;
      font-size: 13.5px;
      color: #581c87;
    }

    .status-pill {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 8px;
      margin-left: 6px;
    }
    .pill-locked { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    .pill-unlocked { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 9px 16px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-nav {
      background: #ffffff;
      color: #6b21a8;
      border: 1px solid var(--border-subtle);
      padding: 6px 12px;
      font-size: 12px;
    }
    .btn-nav:hover {
      background: #f3e8ff;
      color: #4c1d95;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #581c87);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.3);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #6d28d9, #4c1d95);
      transform: translateY(-1px);
    }

    .btn-reset {
      background: #ffffff;
      color: #6b21a8;
      border: 1px solid var(--border-subtle);
    }
    .btn-reset:hover {
      background: #faf5ff;
      border-color: #c4b5fd;
    }

    #lock-banner {
      display: none;
      background: #fffbeb;
      border: 1.5px solid #fde68a;
      color: #b45309;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 18px;
      align-items: center;
      justify-content: space-between;
    }

    /* Table Design */
    .table-container {
      background: var(--card-bg);
      border-radius: 18px;
      overflow-x: auto;
      box-shadow: 0 12px 35px -10px rgba(76, 29, 149, 0.1);
      border: 1px solid var(--border-subtle);
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 1400px;
      text-align: center;
    }

    thead th {
      background: var(--header-bg);
      color: #ffffff;
      padding: 15px 8px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      border-bottom: 2px solid #3b0764;
    }

    th:first-child { border-top-left-radius: 16px; }
    th:last-child { border-top-right-radius: 16px; }

    th .day-name { display: block; font-size: 13px; font-weight: 800; }
    th .day-date { display: block; font-size: 11px; font-weight: 500; color: #e9d5ff; margin-top: 3px; }

    th.col-agent { width: 190px; text-align: left; padding-left: 24px; }
    th.col-zone { width: 190px; text-align: left; padding-left: 16px; }
    th.col-total { width: 230px; }

    tbody tr {
      border-bottom: 1px solid var(--border-color);
      transition: background 0.15s ease;
    }

    tbody tr:hover {
      background: #faf5ff;
    }

    tbody tr:last-child td:first-child { border-bottom-left-radius: 16px; }
    tbody tr:last-child td:last-child { border-bottom-right-radius: 16px; }

    td {
      padding: 10px 4px;
      font-size: 13px;
      border-bottom: 1px solid #f3e8ff;
    }

    td.cell-agent { text-align: left; padding-left: 24px; }
    td.cell-zone { text-align: left; padding-left: 16px; }

    .agent-input, .zone-input {
      width: 95%;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      background: transparent;
      outline: none;
      transition: all 0.2s;
    }
    .agent-input:focus, .zone-input:focus {
      background: #ffffff;
      border-color: #a78bfa;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
    }

    .zone-input {
      color: var(--text-sub);
      font-weight: 600;
      font-size: 12.5px;
    }

    /* Shift Dropdowns */
    select.shift-select {
      width: 100%;
      padding: 9px 4px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid transparent;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      text-align-last: center;
      appearance: none;
      -webkit-appearance: none;
    }

    select.shift-select:disabled {
      cursor: not-allowed;
      opacity: 0.85;
    }

    select.matin { background: var(--matin-bg); color: var(--matin-txt); border-color: var(--matin-border); }
    select.aprem { background: var(--aprem-bg); color: var(--aprem-txt); border-color: var(--aprem-border); }
    select.soir { background: var(--soir-bg); color: var(--soir-txt); border-color: var(--soir-border); }
    select.off { background: var(--off-bg); color: var(--off-txt); border-color: var(--off-border); }

    select optgroup { font-weight: 800; color: #4c1d95; background: #ffffff; }
    select option { font-weight: 600; padding: 6px; }

    /* Total Action Section */
    .total-action-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .hours-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 9px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 11.5px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .badge-ok {
      background: var(--ok-bg);
      color: var(--ok-txt);
      border: 1.5px solid var(--ok-border);
    }

    .badge-alert {
      background: var(--alert-bg);
      color: var(--alert-txt);
      border: 1.5px solid var(--alert-border);
      animation: pulseAlert 1.6s infinite;
    }

    @keyframes pulseAlert {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Structured Dropdown for Row Shift */
    select.btn-shift-choice {
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 800;
      border-radius: 8px;
      background: #faf5ff;
      color: #6b21a8;
      border: 1.5px solid #c4b5fd;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }
    select.btn-shift-choice:hover {
      background: #f3e8ff;
      border-color: #7c3aed;
    }
    select.btn-shift-choice:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .btn-del {
      background: transparent;
      color: #c4b5fd;
      font-size: 16px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
      border: none;
      transition: all 0.2s;
    }
    .btn-del:hover {
      color: #ef4444;
      background: #fee2e2;
    }
    .btn-del:disabled {
      cursor: not-allowed;
      opacity: 0.3;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <div class="brand-title">
      <div class="brand-icon">⚡</div>
      <div>
        <h1>Operational Shift Planning (44H)</h1>
        <p>Thème Electric Violet • Bouton Matin/Soir (17h/19h) • Rotation Salé</p>
      </div>
    </div>

    <div class="week-nav">
      <button class="btn-nav" onclick="changeWeek(-1)">◀ Précédent</button>
      <span id="current-week-label">Semaine ...</span>
      <span id="lock-status-pill" class="status-pill"></span>
      <button class="btn-nav" onclick="changeWeek(1)">Suivant ▶</button>
      <button class="btn-nav" style="margin-left: 6px;" onclick="goToCurrentWeek()">Aujourd'hui</button>
    </div>

    <div class="btn-group">
      <button class="btn-primary" onclick="handleAddNewAgent()">+ Ajouter Agent</button>
      <button class="btn-reset" onclick="resetToDefault()">🔄 Réinitialiser</button>
    </div>
  </div>

  <!-- Notification Banner when locked -->
  <div id="lock-banner">
    <div>
      🔒 <strong>Semaine en cours verrouillée :</strong> Cliquez sur <strong>(Suivant ▶)</strong> pour modifier le planning de la semaine prochaine.
    </div>
    <button class="btn-nav" onclick="forceUnlockCurrentWeek()" style="background:#fff; font-size:11px;">🔓 Déverrouiller Exceptionnellement</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr id="table-header"></tr>
      </thead>
      <tbody id="planning-body"></tbody>
    </table>
  </div>
</div>

<script>
  let currentWeekOffset = 0;
  let manualUnlock = false;

  const SHIFTS = {
    "OFF": { hours: 0, class: "off" },
    
    // Matin (10h)
    "10:00-17:00": { hours: 7, class: "matin" },
    "10:00-18:00": { hours: 8, class: "matin" },

    // Soir (17h)
    "17:00-00:00": { hours: 7, class: "aprem" },
    "17:00-01:00": { hours: 8, class: "aprem" },

    // Soir (19h)
    "19:00-02:00": { hours: 7, class: "soir" },
    "18:00-02:00": { hours: 8, class: "soir" },

    // Autre
    "12:00-19:00": { hours: 7, class: "soir" },
    "12:00-20:00": { hours: 8, class: "soir" }
  };

  const SHIFT_GROUPS = [
    { label: "🔴 REPOS", items: ["OFF"] },
    { label: "☀️ MATIN (10H)", items: ["10:00-17:00", "10:00-18:00"] },
    { label: "🌅 SOIR (17H)", items: ["17:00-00:00", "17:00-01:00"] },
    { label: "🌙 SOIR (19H)", items: ["19:00-02:00", "18:00-02:00"] },
    { label: "⚡ AUTRES", items: ["12:00-19:00", "12:00-20:00"] }
  ];

  const DAYS = ["LUN", "MAR", "MER", "JEU", "VEN", "SAM", "DIM"];

  const defaultAgents = [
    { name: "Yahya Rhallab", zone: "Temara - Oulad Mtaa", offDay: 0, shiftType: "matin" },
    { name: "Mehdi Ait Jebour", zone: "Temara - Oulad Mtaa", offDay: 1, shiftType: "soir17" },
    { name: "Ayman Chlifane", zone: "Temara - Oulad Mtaa", offDay: 2, shiftType: "soir19" },
    { name: "Mourad Cherradi", zone: "Agdal - Carrousel", offDay: 1, shiftType: "matin" },
    { name: "Youssef Derkaoui", zone: "Agdal - Carrousel", offDay: 0, shiftType: "soir17" },
    { name: "Ayoub Abssi", zone: "Agdal - Carrousel", offDay: 3, shiftType: "soir19" },
    // Salé - Medina (Auto Rotation)
    { name: "Charaf Loummihi", zone: "Salé - Medina", offDay: 1, shiftBaseIndex: 0 },
    { name: "Hassan Azgoune", zone: "Salé - Medina", offDay: 2, shiftBaseIndex: 1 },
    { name: "Ayoub Ben Malek", zone: "Salé - Medina", offDay: 0, shiftBaseIndex: 2 },
    { name: "Achraf Akhlij", zone: "Hay Riad - Soussi", offDay: 3, shiftType: "matin" },
    { name: "Islam Elmardi", zone: "Hay Riad - Soussi", offDay: 2, shiftType: "soir17" },
    { name: "Oussama El Atrach", zone: "Hay Riad - Soussi", offDay: 0, shiftType: "soir19" },
    { name: "Zakariae Benali", zone: "Technopolis", offDay: 0, shiftType: "techno" }
  ];

  let agents = JSON.parse(localStorage.getItem('shift_planning_violet_v6')) || defaultAgents;

  function getMonday(d) {
    d = new Date(d);
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    return new Date(d.setDate(diff));
  }

  function getWeekNumber(d) {
    d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  }

  function getShiftForDay(type, dayIdx) {
    const is8h = (dayIdx === 4 || dayIdx === 5); // Ven / Sam
    if (type === "matin")  return is8h ? "10:00-18:00" : "10:00-17:00";
    if (type === "soir17") return is8h ? "17:00-01:00" : "17:00-00:00";
    if (type === "soir19") return is8h ? "18:00-02:00" : "19:00-02:00";
    if (type === "techno") return is8h ? "12:00-20:00" : "12:00-19:00";
    return "OFF";
  }

  function renderHeader(monday) {
    const headerRow = document.getElementById('table-header');
    let html = `
      <th class="col-agent">Agent</th>
      <th class="col-zone">Zone</th>
    `;

    for (let i = 0; i < 7; i++) {
      const current = new Date(monday);
      current.setDate(monday.getDate() + i);
      const dateStr = current.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
      html += `
        <th>
          <span class="day-name">${DAYS[i]}</span>
          <span class="day-date">${dateStr}</span>
        </th>
      `;
    }

    html += `<th class="col-total">Total & Action Ligne</th><th></th>`;
    headerRow.innerHTML = html;
  }

  function renderTable() {
    const now = new Date();
    const currentMonday = getMonday(now);
    const viewedMonday = new Date(currentMonday);
    viewedMonday.setDate(currentMonday.getDate() + (currentWeekOffset * 7));
    
    const weekNumber = getWeekNumber(viewedMonday);
    const sunday = new Date(viewedMonday);
    sunday.setDate(viewedMonday.getDate() + 6);

    const isCurrentWeek = currentWeekOffset === 0;
    const isLocked = isCurrentWeek && !manualUnlock;

    const banner = document.getElementById('lock-banner');
    const pill = document.getElementById('lock-status-pill');

    if (isLocked) {
      banner.style.display = 'flex';
      pill.className = 'status-pill pill-locked';
      pill.innerText = '🔒 Verrouillée';
    } else {
      banner.style.display = 'none';
      pill.className = 'status-pill pill-unlocked';
      pill.innerText = '🔓 Modifiable';
    }

    document.getElementById('current-week-label').innerText = 
      `Semaine ${weekNumber} (${viewedMonday.toLocaleDateString('fr-FR', {day: '2-digit', month: '2-digit'})} - ${sunday.toLocaleDateString('fr-FR', {day: '2-digit', month: '2-digit', year: 'numeric'})})`;

    renderHeader(viewedMonday);

    const tbody = document.getElementById('planning-body');
    tbody.innerHTML = '';

    const rotationTypes = ["matin", "soir17", "soir19"];

    agents.forEach((agent, agentIdx) => {
      let currentShiftType = agent.shiftType;
      if (agent.zone && agent.zone.includes("Salé") && agent.shiftBaseIndex !== undefined) {
        const rotatedIndex = (agent.shiftBaseIndex + weekNumber) % 3;
        currentShiftType = rotationTypes[rotatedIndex];
      }

      if (!agent.shifts || agent.customWeek !== weekNumber) {
        agent.shifts = [];
        for (let day = 0; day < 7; day++) {
          if (day === agent.offDay) {
            agent.shifts.push("OFF");
          } else {
            agent.shifts.push(getShiftForDay(currentShiftType, day));
          }
        }
      }

      const tr = document.createElement('tr');
      let html = `
        <td class="cell-agent">
          <input class="agent-input" type="text" value="${agent.name}" ${isLocked ? 'readonly' : ''} onchange="updateAgentName(${agentIdx}, this.value)" />
        </td>
        <td class="cell-zone">
          <input class="zone-input" type="text" value="${agent.zone}" ${isLocked ? 'readonly' : ''} onchange="updateAgentZone(${agentIdx}, this.value)" />
        </td>
      `;

      agent.shifts.forEach((shift, dayIdx) => {
        const shiftClass = SHIFTS[shift] ? SHIFTS[shift].class : 'off';
        
        let selectOptions = '';
        SHIFT_GROUPS.forEach(grp => {
          selectOptions += `<optgroup label="${grp.label}">`;
          grp.items.forEach(opt => {
            selectOptions += `<option value="${opt}" ${opt === shift ? 'selected' : ''}>${opt}</option>`;
          });
          selectOptions += `</optgroup>`;
        });

        html += `
          <td>
            <select class="shift-select ${shiftClass}" ${isLocked ? 'disabled' : ''} onchange="updateShift(${agentIdx}, ${dayIdx}, this.value, ${weekNumber})">
              ${selectOptions}
            </select>
          </td>
        `;
      });

      const totalHours = agent.shifts.reduce((sum, s) => sum + (SHIFTS[s] ? SHIFTS[s].hours : 0), 0);
      const isExact44 = totalHours === 44;
      const diff = totalHours - 44;
      const badgeClass = isExact44 ? 'badge-ok' : 'badge-alert';
      const badgeText = isExact44 ? '44h OK' : (diff > 0 ? `${totalHours}h (+${diff}h)` : `${totalHours}h (${diff}h)`);

      // Structured Button for Matin vs Soir (17h/19h)
      html += `
        <td>
          <div class="total-action-box">
            <span class="hours-badge ${badgeClass}">${badgeText}</span>
            <select class="btn-shift-choice" ${isLocked ? 'disabled' : ''} onchange="applyShiftChoice(${agentIdx}, this.value, ${weekNumber})">
              <option value="" disabled selected>⚡ Shift Ligne</option>
              <optgroup label="☀️ MATIN">
                <option value="matin">☀️ Matin (10h)</option>
              </optgroup>
              <optgroup label="🌙 SOIR">
                <option value="soir17">🌅 Soir (17h - Minuit)</option>
                <option value="soir19">🌙 Soir (19h - 02h)</option>
              </optgroup>
              <optgroup label="⚡ AUTRE">
                <option value="techno">⚡ Techno (12h)</option>
              </optgroup>
            </select>
          </div>
        </td>
        <td><button class="btn-del" ${isLocked ? 'disabled' : ''} title="Supprimer" onclick="deleteAgent(${agentIdx})">✕</button></td>
      `;

      tr.innerHTML = html;
      tbody.appendChild(tr);
    });

    saveData();
  }

  function applyShiftChoice(agentIdx, shiftType, weekNumber) {
    if (currentWeekOffset === 0 && !manualUnlock) {
      alert("⚠️ La semaine en cours est verrouillée ! Cliquez sur (Suivant ▶) pour modifier la semaine prochaine.");
      return;
    }
    const agent = agents[agentIdx];
    agent.shiftType = shiftType;
    agent.customWeek = weekNumber;

    for (let day = 0; day < 7; day++) {
      if (agent.shifts[day] === "OFF") continue;
      agent.shifts[day] = getShiftForDay(shiftType, day);
    }
    renderTable();
  }

  function updateShift(agentIdx, dayIdx, val, weekNumber) {
    if (currentWeekOffset === 0 && !manualUnlock) {
      alert("⚠️ La semaine en cours est verrouillée !");
      return;
    }
    agents[agentIdx].shifts[dayIdx] = val;
    agents[agentIdx].customWeek = weekNumber;
    renderTable();
  }

  function updateAgentName(agentIdx, val) {
    agents[agentIdx].name = val;
    saveData();
  }

  function updateAgentZone(agentIdx, val) {
    agents[agentIdx].zone = val;
    saveData();
  }

  function changeWeek(direction) {
    currentWeekOffset += direction;
    manualUnlock = false;
    renderTable();
  }

  function goToCurrentWeek() {
    currentWeekOffset = 0;
    manualUnlock = false;
    renderTable();
  }

  function forceUnlockCurrentWeek() {
    if (confirm("Voulez-vous vraiment déverrouiller la semaine en cours pour modification exceptionnelle ?")) {
      manualUnlock = true;
      renderTable();
    }
  }

  function handleAddNewAgent() {
    if (currentWeekOffset === 0 && !manualUnlock) {
      alert("⚠️ Vous êtes sur la semaine en cours verrouillée. Cliquez sur (Suivant ▶) pour préparer la semaine prochaine !");
      return;
    }
    addNewAgent();
  }

  function addNewAgent() {
    agents.push({
      name: "Nouvel Agent",
      zone: "Zone",
      offDay: 0,
      shiftType: "matin",
      shifts: ["OFF", "10:00-17:00", "10:00-17:00", "10:00-17:00", "10:00-18:00", "10:00-18:00", "10:00-17:00"]
    });
    renderTable();
  }

  function deleteAgent(idx) {
    if (confirm("Supprimer cet agent ?")) {
      agents.splice(idx, 1);
      renderTable();
    }
  }

  function resetToDefault() {
    if (confirm("Réinitialiser le planning aux valeurs par défaut ?")) {
      localStorage.removeItem('shift_planning_violet_v6');
      agents = JSON.parse(JSON.stringify(defaultAgents));
      renderTable();
    }
  }

  function saveData() {
    localStorage.setItem('shift_planning_violet_v6', JSON.stringify(agents));
  }

  renderTable();
</script>

</body>
</html>
