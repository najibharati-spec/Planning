<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning McDo — 10 Ajents</title>
<style>
  :root{
    --bg:#f6f5f2; --surface:#fff; --ink:#1c1917; --muted:#78716c; --border:#e7e5e4;
    --accent:#ffc72c; --danger:#dc2626; --ok:#16a34a;
    --temara:#ea580c; --riad:#2563eb; --agdal:#16a34a; --chaou:#9333ea;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Geist,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  button,select,input{font:inherit;color:inherit}
  header{background:var(--ink);color:#fff;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  header h1{margin:0;font-size:20px;letter-spacing:-.01em}
  header h1 span{color:var(--accent)}
  header p{margin:2px 0 0;color:#d6d3d1;font-size:12px}
  .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .btn{border:1px solid var(--border);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500}
  .btn:hover{border-color:var(--ink)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
  .btn.dark{background:#292524;border-color:#44403c;color:#fff}
  .btn.danger{color:var(--danger)}
  .btn.sm{padding:3px 8px;font-size:12px}
  .seg{display:inline-flex;border:1px solid #44403c;border-radius:8px;overflow:hidden}
  .seg button{background:transparent;border:0;color:#d6d3d1;padding:7px 12px;cursor:pointer}
  .seg button.on{background:var(--accent);color:var(--ink);font-weight:600}
  main{padding:16px 20px;max-width:1500px;margin:0 auto}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:500}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
  .tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
  .scroll{overflow-x:auto}
  table{border-collapse:separate;border-spacing:0;width:100%}
  th,td{padding:6px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  th{font-size:12px;color:var(--muted);font-weight:600;background:#fafaf9;position:sticky;top:0}
  th.day small{display:block;font-weight:400}
  td.name{white-space:nowrap;min-width:190px}
  .handle{cursor:grab;color:var(--muted);user-select:none;padding:0 4px}
  .mv{border:1px solid var(--border);background:var(--surface);border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:11px;line-height:1;padding:0}
  .tag{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;background:#f5f5f4;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .tag.r{background:#fef3c7;color:#92400e}
  .cell{min-width:118px;border-radius:8px;padding:6px 8px;cursor:pointer;background:color-mix(in srgb,var(--c) 11%,white);border-left:4px solid var(--c);transition:transform .1s}
  .cell:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .cell b{display:block;font-size:12px;color:var(--c)}
  .cell .t{font-size:12px;font-variant-numeric:tabular-nums}
  .cell.off{--c:#a8a29e;background:repeating-linear-gradient(45deg,#f5f5f4,#f5f5f4 6px,#fafaf9 6px,#fafaf9 12px);text-align:center;font-weight:600;color:var(--muted)}
  .cell.warn{outline:2px solid var(--danger);outline-offset:-2px}
  .cell.drop{outline:2px dashed var(--ink)}
  tr.dragover td{background:#fef9c3}
  .hours{font-weight:700;font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap}
  .hours.bad{color:#fff;background:var(--danger);border-radius:8px}
  .hours.good{color:var(--ok)}
  tr.over td.name{color:var(--danger)}
  .alerts{margin:14px 0;padding:12px 14px;border-radius:12px;border:1px solid #fecaca;background:#fef2f2;color:#991b1b}
  .alerts.okk{border-color:#bbf7d0;background:#f0fdf4;color:#166534}
  .alerts ul{margin:6px 0 0;padding-left:18px}
  .zone-head{display:flex;align-items:center;gap:8px;font-weight:600}
  .zone-head .bar{width:6px;height:28px;border-radius:3px;background:var(--c)}
  .zcell{min-width:150px;min-height:70px;border-radius:8px;padding:6px;background:color-mix(in srgb,var(--c) 7%,white);display:flex;flex-direction:column;gap:4px}
  .zcell.drop{outline:2px dashed var(--c)}
  .pill{display:flex;justify-content:space-between;gap:6px;font-size:12px;background:#fff;border:1px solid var(--border);border-left:3px solid var(--c);border-radius:6px;padding:3px 6px;cursor:grab}
  .pill span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .miss{font-size:10px;color:var(--danger);font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
  .stat{padding:14px}
  .stat small{color:var(--muted);font-size:12px}
  .stat div{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat.bad div{color:var(--danger)}
  .daybar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .daybar button{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer}
  .daybar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tl{padding:14px;min-width:820px}
  .tl-row{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:10px;height:38px}
  .tl-track{position:relative;height:100%;background-image:linear-gradient(to right,var(--border) 1px,transparent 1px);background-size:calc(100%/17) 100%;border-right:1px solid var(--border)}
  .peak{position:absolute;top:0;bottom:0;background:rgba(255,199,44,.18)}
  .tl-bar{position:absolute;top:6px;bottom:6px;border-radius:6px;background:var(--c);color:#fff;font-size:11px;font-weight:600;padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;cursor:pointer}
  .tl-axis{position:relative;height:20px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tl-axis span{position:absolute;transform:translateX(-50%)}
  .cov td,.cov th{text-align:center;padding:6px 4px;font-variant-numeric:tabular-nums}
  .cov td:first-child,.cov th:first-child{text-align:left;padding-left:10px;white-space:nowrap}
  .cov .v{display:block;border-radius:6px;padding:4px 0;font-weight:600}
  .grid2{display:grid;gap:16px}
  .section-title{font-size:15px;font-weight:700;margin:20px 0 8px}
  .muted{color:var(--muted)}
  .form-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px}
  input[type=text],select,input[type=time]{border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:#fff}
  dialog{border:0;border-radius:14px;padding:0;width:min(420px,94vw);box-shadow:0 20px 50px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(28,25,23,.45)}
  .dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
  .dlg h3{margin:0}
  .dlg label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
  .dlg .row{display:flex;gap:10px}
  .dlg .row>*{flex:1}
  .dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
  .check{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important;font-weight:400!important}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.show{opacity:1}
  .hint{font-size:12px;color:var(--muted);margin:0 0 10px}
  @media print{header .actions,.tabs,.hint,.mv,.handle,.legend{display:none!important}body{background:#fff}main{padding:0}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Planning <span>McDo</span> — Ajents</h1>
    <p>44h f simana · 1 nhar OFF (Lundi → Jeudi) · Khadma 09:00 → 01:00</p>
  </div>
  <div class="actions">
    <div class="seg" role="group" aria-label="Simana">
      <button id="w1">Simana 1</button>
      <button id="w2">Simana 2</button>
    </div>
    <button class="btn primary" id="regen">Generer planning jdid</button>
    <button class="btn dark" id="print">Imprimer</button>
  </div>
</header>

<main>
  <div class="legend" id="legend"></div>
  <nav class="tabs" id="tabs">
    <button data-v="planning">Planning</button>
    <button data-v="zones">Zones</button>
    <button data-v="dashboard">Dashboard</button>
    <button data-v="agents">Ajents (zid / n9as)</button>
  </nav>
  <section id="view"></section>
</main>

<dialog id="dlg"><form method="dialog" class="dlg" id="dlgForm"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const KEY = 'mcdo-planning-v1';
const DAYS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const STORES = [
  {id:'temara', name:'McDo Temara',   short:'Temara',   color:'var(--temara)'},
  {id:'riad',   name:'McDo Hay Riad', short:'Hay Riad', color:'var(--riad)'},
  {id:'agdal',  name:'McDo Agdal',    short:'Agdal',    color:'var(--agdal)'},
  {id:'chaou',  name:'McDo Hay Chaou',short:'Hay Chaou',color:'var(--chaou)'},
];
const SHIFTS = {matin:'Sbah', milieu:'Wast', soir:'3chiya'};
const MAX_HOURS = 44;
const OFF_DAYS = [0,1,2,3];
const RESTRICTED_STORES = ['agdal','chaou'];

const storeById = id => STORES.find(s => s.id === id);
const dayDur = d => (d === 4 || d === 5) ? 8 : 7;
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = h => { const m = Math.round(((h % 24) + 24) % 24 * 60); return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); };
const parseTime = (str, after) => {
  const [H, M] = str.split(':').map(Number); let v = H + (M||0)/60;
  if (after === undefined) { if (v < 5) v += 24; } else { while (v <= after) v += 24; }
  return v;
};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function makeShift(store, shift, d){
  const dur = dayDur(d);
  const start = shift === 'matin' ? 9 : shift === 'milieu' ? 12 : 25 - dur;
  return {store, shift, start, end: start + dur};
}

function defaultState(){
  const names = ['Youssef Derkaoui','Aymane Chlifane','Islam Elmardi','Oussama El Atrach','Mourad Cherradi','Ayoub Abssi','Hassan Azgoune','Ayoub Ben Malek','Charaf Loummihi','Mohamd Khalyl'];
  const restricted = ['Hassan Azgoune','Ayoub Ben Malek','Charaf Loummihi'];
  const s = {
    agents: names.map((n,i) => ({id: uid(), name: n, restricted: restricted.includes(n), off: i % 4, pref: 'auto'})),
    week: 1, seed: 0, plan: {}, view: 'planning', dashDay: 0,
  };
  generate(s);
  return s;
}

function weeklyShifts(s){
  const map = {}; let dayCount = 0;
  s.agents.forEach((a, i) => {
    if (a.pref !== 'auto') { map[a.id] = a.pref; return; }
    if ((i + s.week) % 2 === 1) map[a.id] = 'soir';
    else { map[a.id] = dayCount % 2 === 1 ? 'milieu' : 'matin'; dayCount++; }
  });
  return map;
}

function generate(s){
  const rng = mulberry32(s.week * 7919 + (s.seed || 0) * 104729 + 17);
  const shiftOf = weeklyShifts(s);
  const plan = {}, visits = {};
  s.agents.forEach(a => { plan[a.id] = Array(7).fill(null); visits[a.id] = {}; });

  const riadDay = {}, taken = new Set();
  s.agents.filter(a => a.restricted).forEach((a, k) => {
    const prefs = [0,1,2,3,4,5,6].map(x => (x + k * 2 + s.week) % 7);
    const d = prefs.find(d => d !== a.off && !taken.has(d)) ?? prefs.find(d => d !== a.off);
    if (d !== undefined) { riadDay[a.id] = d; taken.add(d); }
  });

  for (let d = 0; d < 7; d++){
    s.agents.filter(a => a.off === d).forEach(a => plan[a.id][d] = {off: true});
    const working = s.agents.filter(a => a.off !== d);
    for (let i = working.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); [working[i], working[j]] = [working[j], working[i]]; }
    working.sort((x, y) => (y.restricted ? 1 : 0) - (x.restricted ? 1 : 0));
    const today = [];
    working.forEach(a => {
      const sh = shiftOf[a.id];
      let cands = a.restricted ? (riadDay[a.id] === d ? ['riad'] : [...RESTRICTED_STORES]) : STORES.map(x => x.id);
      const prev = d > 0 && plan[a.id][d-1] && !plan[a.id][d-1].off ? plan[a.id][d-1].store : null;
      if (prev && cands.length > 1) cands = cands.filter(c => c !== prev);
      let best = cands[0], bestScore = Infinity;
      cands.forEach(c => {
        const same = today.filter(x => x.store === c && x.shift === sh).length;
        const total = today.filter(x => x.store === c).length;
        const score = same * 10 + total * 4 + (visits[a.id][c] || 0) * 3 + rng();
        if (score < bestScore) { bestScore = score; best = c; }
      });
      today.push({store: best, shift: sh});
      visits[a.id][best] = (visits[a.id][best] || 0) + 1;
      plan[a.id][d] = makeShift(best, sh, d);
    });
  }
  s.plan = plan;
}

function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.agents && s.plan ? s : null; } catch { return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }

let state = load() || defaultState();
state.agents.forEach(a => { if (!state.plan[a.id]) state.plan[a.id] = Array(7).fill({off:true}); });

const hoursOf = id => (state.plan[id] || []).reduce((t, c) => t + (c && !c.off ? c.end - c.start : 0), 0);

function computeAlerts(){
  const list = [], cellWarn = new Set();
  state.agents.forEach(a => {
    const p = state.plan[a.id]; const h = hoursOf(a.id);
    if (h > MAX_HOURS) list.push(`${a.name}: ${h}h — kter men ${MAX_HOURS}h`);
    const offs = p.map((c,d) => c && c.off ? d : -1).filter(d => d >= 0);
    offs.filter(d => d >= 4).forEach(d => { list.push(`${a.name}: OFF nhar ${DAYS[d]} (mamnou3)`); cellWarn.add(a.id + '-' + d); });
    if (offs.length === 0) list.push(`${a.name}: ma 3andouch nhar OFF`);
    p.forEach((c, d) => {
      if (d > 0 && c && !c.off && p[d-1] && !p[d-1].off && p[d-1].store === c.store) { list.push(`${a.name}: 3awd khdam f ${storeById(c.store).short} nhar ${DAYS[d]}`); cellWarn.add(a.id + '-' + d); }
    });
    if (a.restricted){
      const riad = p.filter(c => c && !c.off && c.store === 'riad').length;
      if (riad !== 1) list.push(`${a.name}: khaso nhar wa7ed f Hay Riad (daba ${riad})`);
      p.forEach((c, d) => { if (c && !c.off && c.store === 'temara') { list.push(`${a.name}: ma khasoch ykhdem f Temara (${DAYS[d]})`); cellWarn.add(a.id + '-' + d); } });
    }
  });
  for (let d = 0; d < 7; d++){
    const r = state.agents.filter(a => a.restricted && state.plan[a.id][d] && state.plan[a.id][d].store === 'riad');
    if (r.length > 1) { list.push(`${DAYS[d]}: ${r.map(a => a.name).join(' + ')} f Hay Riad f nafs nhar`); r.forEach(a => cellWarn.add(a.id + '-' + d)); }
  }
  return {list, cellWarn};
}

const $ = sel => document.querySelector(sel);
const view = $('#view');
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }

function render(){
  $('#w1').classList.toggle('on', state.week === 1);
  $('#w2').classList.toggle('on', state.week === 2);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === state.view));
  $('#legend').innerHTML = STORES.map(s => `<span class="chip" style="--c:${s.color}"><span class="dot"></span>${s.name}</span>`).join('') +
    `<span class="chip">Sbah 09:00 · Wast 12:00 · 3chiya → 01:00</span><span class="chip" style="--c:rgba(255,199,44,.8)"><span class="dot"></span>Khadma mazyana 12–15 / 18–01</span>`;
  ({planning: renderPlanning, zones: renderZones, dashboard: renderDashboard, agents: renderAgents})[state.view]();
  save();
}

function alertsBox(list){
  if (!list.length) return `<div class="alerts okk"><strong>Planning mtwazen</strong> — ga3 l9awa3id m7tarma.</div>`;
  return `<div class="alerts"><strong>${list.length} mochkil</strong><ul>${list.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
}

function renderPlanning(){
  const {list, cellWarn} = computeAlerts();
  let html = `<p class="hint">Click 3la case bach tbdel zone / wa9t / OFF. Jerr case l case khra f nafs nhar bach tbdel binathom. Jerr ≡ (ola ▲▼) bach tla3 / tahbet ajent.</p>
  <div class="card scroll"><table><thead><tr><th>Ajent</th>${DAYS.map((d,i) => `<th class="day">${d}<small>${dayDur(i)}h</small></th>`).join('')}<th style="text-align:center">Total</th></tr></thead><tbody>`;
  state.agents.forEach((a, i) => {
    const h = hoursOf(a.id), over = h > MAX_HOURS;
    html += `<tr data-row="${i}" class="${over ? 'over' : ''}"><td class="name">
      <span class="handle" draggable="true" data-drag-row="${i}" title="Jerr bach tbdel tartib">≡</span>
      <button class="mv" data-up="${i}" aria-label="Tla3 ${esc(a.name)}">▲</button>
      <button class="mv" data-down="${i}" aria-label="Hbet ${esc(a.name)}">▼</button>
      <strong style="margin-left:4px">${esc(a.name)}</strong>
      ${a.restricted ? '<br><span class="tag r">Agdal / Chaou</span>' : ''}</td>`;
    for (let d = 0; d < 7; d++){
      const c = state.plan[a.id][d], warn = cellWarn.has(a.id + '-' + d) ? ' warn' : '';
      if (!c || c.off) html += `<td><div class="cell off${warn}" draggable="true" data-a="${a.id}" data-d="${d}">OFF</div></td>`;
      else {
        const st = storeById(c.store);
        html += `<td><div class="cell${warn}" style="--c:${st.color}" draggable="true" data-a="${a.id}" data-d="${d}">
          <b>${st.short}</b><span class="t">${fmt(c.start)} – ${fmt(c.end)}</span><br><span class="tag">${SHIFTS[c.shift] || 'Custom'}</span></div></td>`;
      }
    }
    html += `<td><div class="hours ${over ? 'bad' : h === MAX_HOURS ? 'good' : ''}" style="padding:10px 6px">${h}h</div></td></tr>`;
  });
  html += `</tbody></table></div>` + alertsBox(list);
  view.innerHTML = html;
  bindPlanning();
}

function bindPlanning(){
  view.querySelectorAll('[data-up]').forEach(b => b.onclick = () => moveAgent(+b.dataset.up, +b.dataset.up - 1));
  view.querySelectorAll('[data-down]').forEach(b => b.onclick = () => moveAgent(+b.dataset.down, +b.dataset.down + 1));
  view.querySelectorAll('.cell').forEach(el => {
    el.onclick = () => openEditor(el.dataset.a, +el.dataset.d);
    el.ondragstart = e => { e.stopPropagation(); e.dataTransfer.setData('text/plain', JSON.stringify({type:'cell', a: el.dataset.a, d: +el.dataset.d})); };
    el.ondragover = e => { e.preventDefault(); e.stopPropagation(); el.classList.add('drop'); };
    el.ondragleave = () => el.classList.remove('drop');
    el.ondrop = e => {
      e.preventDefault(); e.stopPropagation(); el.classList.remove('drop');
      const data = readDrag(e); if (!data || data.type !== 'cell') return;
      const d = +el.dataset.d;
      if (data.d !== d) return toast('Tbdil ghir f nafs nhar');
      if (data.a === el.dataset.a) return;
      const pa = state.plan[data.a], pb = state.plan[el.dataset.a];
      [pa[d], pb[d]] = [pb[d], pa[d]];
      toast('Tbadlo ' + DAYS[d]); render();
    };
  });
  view.querySelectorAll('[data-drag-row]').forEach(h => h.ondragstart = e => e.dataTransfer.setData('text/plain', JSON.stringify({type:'row', i: +h.dataset.dragRow})));
  view.querySelectorAll('tr[data-row]').forEach(tr => {
    tr.ondragover = e => { e.preventDefault(); tr.classList.add('dragover'); };
    tr.ondragleave = () => tr.classList.remove('dragover');
    tr.ondrop = e => { e.preventDefault(); tr.classList.remove('dragover'); const data = readDrag(e); if (data && data.type === 'row') moveAgent(data.i, +tr.dataset.row); };
  });
}

function readDrag(e){ try { return JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return null; } }
function moveAgent(from, to){
  if (to < 0 || to >= state.agents.length || from === to) return;
  const [a] = state.agents.splice(from, 1); state.agents.splice(to, 0, a); render();
}

function renderZones(){
  let html = `<p class="hint">Jerr ajent men zone l zone khra f nafs nhar.</p><div class="card scroll"><table><thead><tr><th>Zone</th>${DAYS.map(d => `<th>${d}</th>`).join('')}</tr></thead><tbody>`;
  STORES.forEach(st => {
    html += `<tr><td><div class="zone-head" style="--c:${st.color}"><span class="bar"></span>${st.name}</div></td>`;
    for (let d = 0; d < 7; d++){
      const here = state.agents.map(a => ({a, c: state.plan[a.id][d]})).filter(x => x.c && !x.c.off && x.c.store === st.id).sort((x,y) => x.c.start - y.c.start);
      const morning = here.some(x => x.c.start <= 9), night = here.some(x => x.c.end >= 25);
      html += `<td><div class="zcell" style="--c:${st.color}" data-zs="${st.id}" data-zd="${d}">
        ${here.map(x => `<div class="pill" draggable="true" data-pa="${x.a.id}" data-pd="${d}"><span>${esc(x.a.name.split(' ')[0])} ${esc((x.a.name.split(' ')[1]||'')[0]||'')}.</span><span>${fmt(x.c.start)}–${fmt(x.c.end)}</span></div>`).join('')}
        ${!morning ? '<span class="miss">Ma kayn 7ta wa7ed f 09:00</span>' : ''}${!night ? '<span class="miss">Ma kayn 7ta wa7ed 7tal 01:00</span>' : ''}
      </div></td>`;
    }
    html += `</tr>`;
  });
  html += `</tbody></table></div>` + alertsBox(computeAlerts().list);
  view.innerHTML = html;
  view.querySelectorAll('.pill').forEach(p => {
    p.ondragstart = e => e.dataTransfer.setData('text/plain', JSON.stringify({type:'pill', a: p.dataset.pa, d: +p.dataset.pd}));
    p.onclick = () => openEditor(p.dataset.pa, +p.dataset.pd);
  });
  view.querySelectorAll('.zcell').forEach(z => {
    z.ondragover = e => { e.preventDefault(); z.classList.add('drop'); };
    z.ondragleave = () => z.classList.remove('drop');
    z.ondrop = e => {
      e.preventDefault(); z.classList.remove('drop');
      const data = readDrag(e); if (!data || data.type !== 'pill') return;
      if (data.d !== +z.dataset.zd) return toast('Tbdil ghir f nafs nhar');
      state.plan[data.a][data.d].store = z.dataset.zs; toast('Tbdlat zone'); render();
    };
  });
}

function renderDashboard(){
  const d = state.dashDay;
  const {list} = computeAlerts();
  const totalH = state.agents.reduce((t, a) => t + hoursOf(a.id), 0);
  const over = state.agents.filter(a => hoursOf(a.id) > MAX_HOURS).length;
  const working = state.agents.filter(a => state.plan[a.id][d] && !state.plan[a.id][d].off);
  const offs = state.agents.filter(a => !state.plan[a.id][d] || state.plan[a.id][d].off);
  const pos = h => ((h - 9) / 17 * 100) + '%';

  let html = `<div class="stats">
    <div class="card stat"><small>Ajents</small><div>${state.agents.length}</div></div>
    <div class="card stat"><small>Total sa3at (simana ${state.week})</small><div>${totalH}h</div></div>
    <div class="card stat ${over ? 'bad' : ''}"><small>Kter men 44h</small><div>${over}</div></div>
    <div class="card stat ${list.length ? 'bad' : ''}"><small>Machakil</small><div>${list.length}</div></div>
  </div>
  <div class="daybar">${DAYS.map((n,i) => `<button data-day="${i}" class="${i === d ? 'on' : ''}">${n}</button>`).join('')}</div>
  <div class="card scroll"><div class="tl">
    <div class="tl-row"><div class="muted" style="font-size:12px">${DAYS[d]} · ${working.length} khdamin</div>
      <div class="tl-axis">${Array.from({length:18}, (_, i) => `<span style="left:${i/17*100}%">${fmt(9 + i).slice(0,2)}h</span>`).join('')}</div></div>`;
  working.sort((x, y) => state.plan[x.id][d].start - state.plan[y.id][d].start).forEach(a => {
    const c = state.plan[a.id][d], st = storeById(c.store);
    html += `<div class="tl-row"><div><strong style="font-size:13px">${esc(a.name)}</strong><br><span class="muted" style="font-size:11px">${hoursOf(a.id)}h f simana</span></div>
      <div class="tl-track"><div class="peak" style="left:${pos(12)};width:${3/17*100}%"></div><div class="peak" style="left:${pos(18)};width:${7/17*100}%"></div>
      <div class="tl-bar" style="--c:${st.color};left:${pos(c.start)};width:${(c.end - c.start)/17*100}%" data-a="${a.id}" title="${esc(a.name)} — ${st.name}">${st.short} · ${fmt(c.start)} → ${fmt(c.end)}</div></div></div>`;
  });
  html += `<p class="muted" style="margin:10px 0 0;font-size:12px">OFF: ${offs.length ? offs.map(a => esc(a.name)).join(', ') : '—'}</p></div></div>`;

  const hours = Array.from({length:16}, (_, i) => 9 + i);
  html += `<h2 class="section-title">Ch7al men wa7ed f kol zone (${DAYS[d]})</h2><div class="card scroll"><table class="cov"><thead><tr><th>Zone</th>${hours.map(h => `<th>${fmt(h).slice(0,2)}</th>`).join('')}</tr></thead><tbody>`;
  STORES.forEach(st => {
    html += `<tr><td><span class="chip" style="--c:${st.color}"><span class="dot"></span>${st.short}</span></td>`;
    hours.forEach(h => {
      const n = working.filter(a => { const c = state.plan[a.id][d]; return c.store === st.id && c.start <= h && c.end >= h + 1; }).length;
      const peak = (h >= 12 && h < 15) || h >= 18;
      const bg = n === 0 ? (peak ? 'var(--danger)' : '#fee2e2') : `color-mix(in srgb, ${st.color} ${Math.min(25 + n * 25, 100)}%, white)`;
      const col = n === 0 ? (peak ? '#fff' : '#991b1b') : (n >= 2 ? '#fff' : 'var(--ink)');
      html += `<td style="${peak ? 'background:rgba(255,199,44,.12)' : ''}"><span class="v" style="background:${bg};color:${col}">${n}</span></td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div>
  <h2 class="section-title">Sa3at kol ajent f simana</h2><div class="card scroll"><table><thead><tr><th>Ajent</th><th>Sa3at</th><th>Bda → Sala (lyoum)</th><th>Zones f simana</th></tr></thead><tbody>
  ${state.agents.map(a => { const h = hoursOf(a.id), c = state.plan[a.id][d];
    const zones = [...new Set(state.plan[a.id].filter(x => x && !x.off).map(x => storeById(x.store).short))].join(', ');
    return `<tr class="${h > MAX_HOURS ? 'over' : ''}"><td class="name">${esc(a.name)}</td><td><span class="hours ${h > MAX_HOURS ? 'bad' : h === MAX_HOURS ? 'good' : ''}" style="padding:2px 8px">${h}h / ${MAX_HOURS}h</span></td>
    <td>${c && !c.off ? `${fmt(c.start)} → ${fmt(c.end)}` : '<span class="muted">OFF</span>'}</td><td class="muted">${zones}</td></tr>`; }).join('')}
  </tbody></table></div>`;
  view.innerHTML = html;
  view.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { state.dashDay = +b.dataset.day; render(); });
  view.querySelectorAll('.tl-bar').forEach(b => b.onclick = () => openEditor(b.dataset.a, d));
}

function renderAgents(){
  const offCount = OFF_DAYS.map(d => state.agents.filter(a => a.off === d).length);
  let html = `<p class="hint">Ila bdelti OFF, l9awa3id ola wa9t, l planning kay3awd ytgenera automatiquement. Smiya katbdel bla ma ytbdel walo.</p>
  <div class="card form-row"><input type="text" id="newName" placeholder="Smiya dyal ajent jdid" aria-label="Smiya dyal ajent jdid">
    <label class="check" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="newR"> Ghir Agdal / Hay Chaou</label>
    <button class="btn primary" id="addA">+ Zid ajent</button>
    <span class="muted" style="font-size:12px">OFF: ${OFF_DAYS.map(d => `${DAYS[d].slice(0,3)} ${offCount[d]}`).join(' · ')}</span></div>
  <div class="card scroll" style="margin-top:12px"><table><thead><tr><th>Smiya</th><th>Zones</th><th>Nhar OFF</th><th>Wa9t (had simana)</th><th></th></tr></thead><tbody>`;
  state.agents.forEach(a => {
    html += `<tr><td><input type="text" value="${esc(a.name)}" data-name="${a.id}" aria-label="Smiya"></td>
    <td><label class="check" style="display:flex;align-items:center;gap:6px"><input type="checkbox" data-r="${a.id}" ${a.restricted ? 'checked' : ''}> Ghir Agdal / Chaou (+1 nhar Hay Riad)</label></td>
    <td><select data-off="${a.id}" aria-label="Nhar OFF">${OFF_DAYS.map(d => `<option value="${d}" ${a.off === d ? 'selected' : ''}>${DAYS[d]}</option>`).join('')}</select></td>
    <td><select data-pref="${a.id}" aria-label="Wa9t">${[['auto','Auto (ytbdel kol simana)'],['matin','Sbah'],['milieu','Wast'],['soir','3chiya']].map(([v,l]) => `<option value="${v}" ${a.pref === v ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
    <td><button class="btn sm danger" data-del="${a.id}">N9es</button></td></tr>`;
  });
  html += `</tbody></table></div>`;
  view.innerHTML = html;
  const regen = msg => { generate(state); render(); toast(msg); };
  $('#addA').onclick = () => {
    const name = $('#newName').value.trim(); if (!name) return toast('Kteb smiya');
    const off = OFF_DAYS.reduce((m, d) => offCount[d] < offCount[m] ? d : m, 0);
    state.agents.push({id: uid(), name, restricted: $('#newR').checked, off, pref: 'auto'});
    regen(name + ' tzad');
  };
  view.querySelectorAll('[data-name]').forEach(i => i.onchange = () => { const a = state.agents.find(x => x.id === i.dataset.name); a.name = i.value.trim() || a.name; save(); toast('Tsajlat'); });
  view.querySelectorAll('[data-r]').forEach(i => i.onchange = () => { state.agents.find(x => x.id === i.dataset.r).restricted = i.checked; regen('Planning tbdel'); });
  view.querySelectorAll('[data-off]').forEach(i => i.onchange = () => { state.agents.find(x => x.id === i.dataset.off).off = +i.value; regen('OFF tbdel'); });
  view.querySelectorAll('[data-pref]').forEach(i => i.onchange = () => { state.agents.find(x => x.id === i.dataset.pref).pref = i.value; regen('Wa9t tbdel'); });
  view.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const a = state.agents.find(x => x.id === b.dataset.del);
    if (!confirm(`N9es ${a.name}?`)) return;
    state.agents = state.agents.filter(x => x.id !== a.id); delete state.plan[a.id]; regen(a.name + ' tn9es');
  });
}

function openEditor(agentId, d){
  const a = state.agents.find(x => x.id === agentId); const c = state.plan[agentId][d] || {off:true};
  const shift = c.off ? weeklyShifts(state)[agentId] : c.shift;
  const base = c.off ? makeShift(a.restricted ? 'agdal' : 'temara', shift, d) : c;
  const oldOff = state.plan[agentId].findIndex((x, i) => i !== d && x && x.off);
  const dlg = $('#dlg'), f = $('#dlgForm');
  f.innerHTML = `<h3>${esc(a.name)} — ${DAYS[d]}</h3>
    <label>Status<select id="eStatus"><option value="work" ${!c.off ? 'selected' : ''}>Khdam</option><option value="off" ${c.off ? 'selected' : ''}>OFF</option></select></label>
    <div id="eWork">
      <label>Zone<select id="eStore">${STORES.map(s => `<option value="${s.id}" ${base.store === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}</select></label>
      <label style="margin-top:10px">Wa9t<select id="eShift">${Object.entries(SHIFTS).map(([k,v]) => `<option value="${k}" ${base.shift === k ? 'selected' : ''}>${v}</option>`).join('')}<option value="custom" ${!SHIFTS[base.shift] ? 'selected' : ''}>Custom</option></select></label>
      <div class="row" style="margin-top:10px"><label>Bda<input type="time" id="eStart" value="${fmt(base.start)}"></label><label>Sala<input type="time" id="eEnd" value="${fmt(base.end)}"></label></div>
    </div>
    <div id="eOff">${oldOff >= 0 ? `<label class="check"><input type="checkbox" id="eSwap" checked> Rjje3 ${DAYS[oldOff]} (OFF l9dim) nhar khdma</label>` : ''}
      ${d >= 4 ? '<p class="miss" style="margin:6px 0 0">Ma khasch OFF nhar Vendredi / Samedi / Dimanche</p>' : ''}</div>
    <div class="foot"><button class="btn" value="cancel">Lgha</button><button class="btn primary" id="eSave" value="ok">Sajjel</button></div>`;
  const sync = () => { const off = $('#eStatus').value === 'off'; $('#eWork').style.display = off ? 'none' : ''; $('#eOff').style.display = off ? '' : 'none'; };
  $('#eStatus').onchange = sync; sync();
  $('#eShift').onchange = () => { const v = $('#eShift').value; if (v === 'custom') return; const m = makeShift('', v, d); $('#eStart').value = fmt(m.start); $('#eEnd').value = fmt(m.end); };
  ['eStart','eEnd'].forEach(id => $('#' + id).oninput = () => $('#eShift').value = 'custom');
  $('#eSave').onclick = e => {
    e.preventDefault();
    if ($('#eStatus').value === 'off'){
      state.plan[agentId][d] = {off: true};
      const swap = $('#eSwap');
      if (swap && swap.checked){
        const neighbors = [state.plan[agentId][oldOff - 1], state.plan[agentId][oldOff + 1]].filter(x => x && !x.off).map(x => x.store);
        const pool = a.restricted ? RESTRICTED_STORES : STORES.map(s => s.id);
        const store = pool.find(s => !neighbors.includes(s)) || pool[0];
        state.plan[agentId][oldOff] = makeShift(store, weeklyShifts(state)[agentId], oldOff);
      }
      if (d <= 3) a.off = d;
    } else {
      const start = parseTime($('#eStart').value), end = parseTime($('#eEnd').value, start);
      const sh = $('#eShift').value;
      state.plan[agentId][d] = {store: $('#eStore').value, shift: sh === 'custom' ? 'custom' : sh, start, end};
    }
    dlg.close(); render(); toast('Tsajlat');
  };
  dlg.showModal();
}

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { state.view = b.dataset.v; render(); });
$('#w1').onclick = () => { if (state.week === 1) return; state.week = 1; generate(state); render(); toast('Simana 1 — l wa9t tbdel'); };
$('#w2').onclick = () => { if (state.week === 2) return; state.week = 2; generate(state); render(); toast('Simana 2 — li kan sbah wella 3chiya'); };
$('#regen').onclick = () => { if (!confirm('Generer planning jdid? Ga3 tbdilat yadwiyin ghadi ymchiw.')) return; state.seed = (state.seed || 0) + 1; generate(state); render(); toast('Planning jdid'); };
$('#print').onclick = () => window.print();

render();
</script>
</body>
</html>
