<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FieldOps - Operational Shift Planning (44H)</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --pl-bg-gradient: linear-gradient(135deg, #fbf7ff 0%, #f3e8ff 100%);
      --pl-header-bg: linear-gradient(90deg, #4c1d95 0%, #581c87 50%, #6b21a8 100%);
      --pl-card-bg: #ffffff;
      --pl-border-color: #f3e8ff;
      --pl-border-subtle: #e9d5ff;
      --pl-text-main: #3b0764;
      --pl-text-muted: #6b21a8;
      
      --matin-bg: #ede9fe; --matin-txt: #6d28d9; --matin-border: #c4b5fd;
      --aprem-bg: #fae8ff; --aprem-txt: #86198f; --aprem-border: #f0abfc;
      --soir-bg: #e0e7ff; --soir-txt: #3730a3; --soir-border: #a5b4fc;
      --off-bg: #f8fafc; --off-txt: #94a3b8; --off-border: #e2e8f0;
      --ok-bg: #dcfce7; --ok-txt: #15803d; --ok-border: #86efac;
      --alert-bg: #fee2e2; --alert-txt: #b91c1c; --alert-border: #fca5a5;
    }

    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
    body { background: var(--pl-bg-gradient); color: #0f172a; min-height: 100vh; padding: 24px; font-size: 14px; display: flex; justify-content: center; align-items: flex-start; }
    .hidden { display: none !important; }

    #view-planning {
      width: 100%;
      max-width: 1700px;
      background: var(--pl-bg-gradient);
      padding: 24px;
      border-radius: 18px;
      border: 1px solid var(--pl-border-subtle);
      box-shadow: 0 20px 40px -15px rgba(76, 29, 149, 0.15);
    }

    #view-planning .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      background: var(--pl-card-bg);
      padding: 18px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(76, 29, 149, 0.08);
      border: 1px solid var(--pl-border-subtle);
      margin-bottom: 22px;
    }

    #view-planning .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #view-planning .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #7c3aed, #4c1d95);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }

    #view-planning .brand-title h1 {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(90deg, #4c1d95, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    #view-planning .brand-title p {
      font-size: 12px;
      color: #7c3aed;
      font-weight: 600;
      margin-top: 2px;
    }

    #view-planning .week-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #faf5ff;
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid var(--pl-border-subtle);
    }

    #view-planning .week-nav span {
      font-weight: 700;
      font-size: 13.5px;
      color: #581c87;
    }

    #view-planning .status-pill {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
    }
    #view-planning .pill-locked { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    #view-planning .pill-unlocked { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }

    #view-planning .btn-group {
      display: flex;
      gap: 10px;
    }

    #view-planning .btn-nav {
      background: #ffffff;
      color: #6b21a8;
      border: 1px solid var(--pl-border-subtle);
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    #view-planning .btn-nav:hover {
      background: #f3e8ff;
      color: #4c1d95;
    }

    #view-planning .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #581c87);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.3);
      padding: 9px 16px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    #view-planning .btn-primary:hover {
      background: linear-gradient(135deg, #6d28d9, #4c1d95);
      transform: translateY(-1px);
    }

    #view-planning .btn-reset {
      background: #ffffff;
      color: #6b21a8;
      border: 1px solid var(--pl-border-subtle);
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    #view-planning .btn-reset:hover {
      background: #faf5ff;
      border-color: #c4b5fd;
    }

    #view-planning #lock-banner {
      display: none;
      background: #fffbeb;
      border: 1.5px solid #fde68a;
      color: #b45309;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 18px;
      align-items: center;
      justify-content: space-between;
    }

    #view-planning .table-container {
      background: var(--pl-card-bg);
      border-radius: 18px;
      overflow-x: auto;
      box-shadow: 0 12px 35px -10px rgba(76, 29, 149, 0.1);
      border: 1px solid var(--pl-border-subtle);
    }

    #view-planning table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 1500px;
      text-align: center;
    }

    #view-planning thead th {
      background: var(--pl-header-bg);
      color: #ffffff;
      padding: 16px 8px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      border-bottom: 2px solid #3b0764;
    }
    #view-planning th:first-child { border-top-left-radius: 16px; }
    #view-planning th:last-child { border-top-right-radius: 16px; }

    #view-planning th .day-name { display: block; font-size: 13px; font-weight: 800; }
    #view-planning th .day-date { display: block; font-size: 11px; font-weight: 500; color: #e9d5ff; margin-top: 3px; }

    #view-planning th.col-agent { width: 210px; text-align: left; padding-left: 20px; }
    #view-planning th.col-zone { width: 200px; text-align: left; padding-left: 14px; }
    #view-planning th.col-total { width: 240px; }

    #view-planning tbody tr {
      border-bottom: 1px solid var(--pl-border-color);
      transition: background 0.15s ease;
    }
    #view-planning tbody tr:hover { background: #faf5ff; }

    #view-planning td {
      padding: 12px 6px;
      font-size: 13px;
      border-bottom: 1px solid #f3e8ff;
    }
    #view-planning td.cell-agent { text-align: left; padding-left: 16px; }
    #view-planning td.cell-zone { text-align: left; padding-left: 12px; }

    #view-planning .field-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fbf7ff;
      border: 1px solid #f3e8ff;
      border-radius: 8px;
      padding: 6px 10px;
      gap: 6px;
    }
    #view-planning .field-box:hover { border-color: #c4b5fd; background: #ffffff; }

    #view-planning .field-text {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--pl-text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }
    #view-planning .field-text.zone-txt { color: #6b21a8; font-weight: 600; }

    #view-planning .btn-edit-small {
      background: #f3e8ff;
      color: #7c3aed;
      border: 1px solid #e9d5ff;
      font-size: 11px;
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }
    #view-planning .btn-edit-small:hover:not(:disabled) {
      background: #7c3aed; color: #ffffff; border-color: #7c3aed;
    }
    #view-planning .btn-edit-small:disabled { cursor: not-allowed; opacity: 0.4; }

    #view-planning select.shift-select {
      width: 100%;
      padding: 9px 4px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid transparent;
      cursor: pointer;
      outline: none;
      text-align-last: center;
    }
    #view-planning select.shift-select:disabled { cursor: not-allowed; opacity: 0.85; }

    #view-planning select.matin { background: var(--matin-bg); color: var(--matin-txt); border-color: var(--matin-border); }
    #view-planning select.aprem { background: var(--aprem-bg); color: var(--aprem-txt); border-color: var(--aprem-border); }
    #view-planning select.soir { background: var(--soir-bg); color: var(--soir-txt); border-color: var(--soir-border); }
    #view-planning select.off { background: var(--off-bg); color: var(--off-txt); border-color: var(--off-border); }

    #view-planning select optgroup { font-weight: 800; color: #4c1d95; background: #ffffff; }

    #view-planning .total-action-box { display: flex; align-items: center; justify-content: center; gap: 6px; }

    #view-planning .hours-badge {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 6px 10px; border-radius: 16px; font-weight: 800; font-size: 11.5px; white-space: nowrap;
    }
    #view-planning .badge-ok { background: var(--ok-bg); color: var(--ok-txt); border: 1.5px solid var(--ok-border); }
    #view-planning .badge-alert {
      background: var(--alert-bg); color: var(--alert-txt); border: 1.5px solid var(--alert-border);
      animation: pulseAlert 1.6s infinite;
    }
    @keyframes pulseAlert { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

    #view-planning select.btn-shift-choice {
      padding: 6px 8px; font-size: 11px; font-weight: 800; border-radius: 8px;
      background: #faf5ff; color: #6b21a8; border: 1.5px solid #c4b5fd; cursor: pointer; outline: none;
    }
    #view-planning select.btn-shift-choice:hover:not(:disabled) { background: #f3e8ff; border-color: #7c3aed; }

    #view-planning .btn-del {
      background: transparent; color: #c4b5fd; font-size: 16px; cursor: pointer; padding: 6px 8px; border-radius: 8px; border: none;
    }
    #view-planning .btn-del:hover:not(:disabled) { color: #ef4444; background: #fee2e2; }

    #planning-custom-modal.modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; z-index: 999;
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    #planning-custom-modal.modal-overlay.active { opacity: 1; pointer-events: auto; }
    #planning-custom-modal .modal-card {
      background: #ffffff; padding: 24px; border-radius: 16px; width: 100%; max-width: 440px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); border: 1px solid var(--pl-border-subtle);
    }
    #planning-custom-modal .modal-header { font-weight: 800; font-size: 16px; color: var(--pl-text-main); margin-bottom: 14px; }
    #planning-custom-modal .modal-body label { display: block; font-size: 12px; font-weight: 700; color: #6b21a8; margin-bottom: 6px; }
    #planning-custom-modal .modal-body input, #planning-custom-modal .modal-body select {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--pl-border-subtle); font-size: 13px; outline: none; margin-bottom: 16px;
    }
    #planning-custom-modal .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
  </style>
</head>
<body>

  <!-- PLANNING EXCLUSIF -->
  <div id="view-planning">
    <div class="top-bar">
      <div class="brand-title">
        <div class="brand-icon">⚡</div>
        <div>
          <h1>Operational Shift Planning (44H)</h1>
          <p>Le Marché (Wahad Lil w Wahad Sbah) • Rotation Temara/Riad/Agdal • Salé & Techno Fixes</p>
        </div>
      </div>

      <div class="week-nav">
        <button class="btn-nav" onclick="changeWeek(-1)">◀ Précédent</button>
        <span id="current-week-label">Semaine ...</span>
        <span id="lock-status-pill" class="status-pill"></span>
        <button class="btn-nav" onclick="changeWeek(1)">Suivant ▶</button>
        <button class="btn-nav" style="margin-left: 6px;" onclick="goToCurrentWeek()">Aujourd'hui</button>
      </div>

      <div class="btn-group">
        <button class="btn-primary" onclick="handleAddNewAgent()">+ Ajouter Agent</button>
        <button class="btn-reset" onclick="resetToDefault()">🔄 Réinitialiser</button>
      </div>
    </div>

    <div id="lock-banner">
      <div>
        🔒 <strong>Semaine en cours verrouillée :</strong> Cliquez sur <strong>(Suivant ▶)</strong> pour modifier le planning de la semaine prochaine.
      </div>
      <button class="btn-nav" onclick="forceUnlockCurrentWeek()" style="background:#fff; font-size:11px;">🔓 Déverrouiller Exceptionnellement</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr id="table-header"></tr>
        </thead>
        <tbody id="planning-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal Dialog for Planning Input/Edits -->
  <div id="planning-custom-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header" id="modal-title">Edit Field</div>
      <div class="modal-body" id="modal-body-content"></div>
      <div class="modal-actions">
        <button class="btn-reset" onclick="closePlanningModal()">Annuler</button>
        <button class="btn-primary" id="modal-save-btn">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    let currentWeekOffset = 0;
    let manualUnlock = false;

    function calculateHours(shiftStr) {
      if (!shiftStr || shiftStr === "OFF" || !shiftStr.includes("-")) return 0;
      const parts = shiftStr.split("-");
      const start = parts[0].trim().split(":");
      const end = parts[1].trim().split(":");
      
      let startH = parseInt(start[0], 10) || 0;
      let startM = parseInt(start[1], 10) || 0;
      let endH = parseInt(end[0], 10) || 0;
      let endM = parseInt(end[1], 10) || 0;

      let startTotalMin = (startH * 60) + startM;
      let endTotalMin = (endH * 60) + endM;

      if (endTotalMin <= startTotalMin) {
        endTotalMin += 24 * 60;
      }

      const diffHours = (endTotalMin - startTotalMin) / 60;
      return Math.round(diffHours * 10) / 10;
    }

    const SHIFTS = {
      "OFF": { hours: 0, class: "off" },
      "10:00-17:00": { hours: 7, class: "matin" },
      "10:00-18:00": { hours: 8, class: "matin" },
      "17:00-01:00": { hours: 8, class: "soir" },
      "15:00-22:00": { hours: 7, class: "aprem" },
      "15:00-23:00": { hours: 8, class: "aprem" },
      "18:00-01:00": { hours: 7, class: "soir" },
      "18:00-02:00": { hours: 8, class: "soir" },
      "12:00-19:00": { hours: 7, class: "soir" },
      "12:00-20:00": { hours: 8, class: "soir" }
    };

    const SHIFT_GROUPS = [
      { label: "🔴 REPOS", items: ["OFF"] },
      { label: "☀️ LE MARCHÉ (SBAB / JOUR)", items: ["10:00-17:00", "10:00-18:00"] },
      { label: "🌙 LE MARCHÉ LIL (17H - 01H)", items: ["17:00-01:00"] },
      { label: "☀️ MATIN STANDARD (09H)", items: ["09:00-16:00", "09:00-17:00"] },
      { label: "🌅 SOIR (15H)", items: ["15:00-22:00", "15:00-23:00"] },
      { label: "🌙 SOIR (18H)", items: ["18:00-01:00", "18:00-02:00"] }
    ];

    const KNOWN_ZONES = [
      "Le Marché",
      "Temara - Oulad Mtaa",
      "Temara - Fouarat",
      "Agdal - Carrousel",
      "Salé - Medina",
      "Hay Riad - Soussi",
      "Technopolis",
      "Harhoura",
      "El Wifaq"
    ];

    const DAYS = ["LUN", "MAR", "MER", "JEU", "VEN", "SAM", "DIM"];

    const defaultAgents = [
      { name: "Yahya Rhallab", zone: "Temara - Oulad Mtaa", offDay: 0, shiftType: "matin", zoneBaseIndex: 0 },
      { name: "Mehdi Ait Jebour", zone: "Temara - Oulad Mtaa", offDay: 1, shiftType: "soir15", zoneBaseIndex: 0 },
      { name: "Ayman Chlifane", zone: "Temara - Oulad Mtaa", offDay: 2, shiftType: "soir18", zoneBaseIndex: 0 },
      { name: "Mourad Cherradi", zone: "Hay Riad - Soussi", offDay: 1, shiftType: "matin", zoneBaseIndex: 1 },
      { name: "Youssef Derkaoui", zone: "Le Marché", offDay: 1, fixedZone: true, leMarcheModeIndex: 0 },
      { name: "Islam Elmardi", zone: "Le Marché", offDay: 2, fixedZone: true, leMarcheModeIndex: 1 },
      { name: "Ayoub Abssi", zone: "Hay Riad - Soussi", offDay: 3, shiftType: "soir18", zoneBaseIndex: 1 },
      { name: "Charaf Loummihi", zone: "Salé - Medina", offDay: 1, shiftType: "matin", fixedZone: true },
      { name: "Hassan Azgoune", zone: "Salé - Medina", offDay: 2, shiftType: "soir15", fixedZone: true },
      { name: "Ayoub Ben Malek", zone: "Salé - Medina", offDay: 0, shiftType: "soir18", fixedZone: true },
      { name: "Achraf Akhlij", zone: "Agdal - Carrousel", offDay: 3, shiftType: "matin", zoneBaseIndex: 2 },
      { name: "Oussama El Atrach", zone: "Agdal - Carrousel", offDay: 0, shiftType: "soir18", zoneBaseIndex: 2 },
      { name: "Zakariae Benali", zone: "Technopolis", offDay: 0, shiftType: "techno", fixedZone: true }
    ];

    const ZONE_ROTATION_LIST = ["Temara - Oulad Mtaa", "Hay Riad - Soussi", "Agdal - Carrousel"];

    let planningDB = JSON.parse(localStorage.getItem('shift_db_le_marche_v3')) || {};

    function getMonday(d) {
      d = new Date(d);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }

    function getWeekKey(monday) {
      return `${monday.getFullYear()}-W${getWeekNumber(monday)}`;
    }

    function getWeekNumber(d) {
      d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function getShiftForDay(type, dayIdx) {
      const is8h = (dayIdx === 4 || dayIdx === 5);
      if (type === "matin")  return is8h ? "10:00-18:00" : "10:00-17:00";
      if (type === "soir15") return is8h ? "15:00-23:00" : "15:00-22:00";
      if (type === "soir18") return is8h ? "18:00-02:00" : "18:00-01:00";
      if (type === "techno") return is8h ? "12:00-20:00" : "12:00-19:00";
      return "OFF";
    }

    function renderHeader(monday) {
      const headerRow = document.getElementById('table-header');
      if (!headerRow) return;
      let html = `
        <th class="col-agent">Agent</th>
        <th class="col-zone">Zone</th>
      `;

      for (let i = 0; i < 7; i++) {
        const current = new Date(monday);
        current.setDate(monday.getDate() + i);
        const dateStr = current.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
        html += `
          <th>
            <span class="day-name">${DAYS[i]}</span>
            <span class="day-date">${dateStr}</span>
          </th>
        `;
      }

      html += `<th class="col-total">Total & Action Ligne</th><th></th>`;
      headerRow.innerHTML = html;
    }

    function getCurrentWeekAgents(weekKey, weekNumber) {
      if (planningDB[weekKey]) {
        return planningDB[weekKey];
      }

      const generated = defaultAgents.map(a => {
        let currentShiftType = a.shiftType;
        let currentZone = a.zone;

        if (!a.fixedZone && a.zoneBaseIndex !== undefined) {
          const zoneIndex = (a.zoneBaseIndex + weekNumber) % ZONE_ROTATION_LIST.length;
          currentZone = ZONE_ROTATION_LIST[zoneIndex];
        }

        const shifts = [];
        for (let day = 0; day < 7; day++) {
          if (day === a.offDay) {
            shifts.push("OFF");
          } else {
            if (a.isLeMarche || a.leMarcheModeIndex !== undefined) {
              // Rotation Lil / Sbah bin Derkaoui w Islam simana b simana
              // Mode 0: Derkaoui Sbah, Islam Lil
              // Mode 1: Islam Sbah, Derkaoui Lil
              const isIslam = a.name.includes("Islam");
              const effectiveMode = (a.leMarcheModeIndex + weekNumber) % 2;
              const isLilAgent = effectiveMode === 1 ? isIslam : !isIslam;

              if (isLilAgent) {
                // Shift d l-lil (17:00 - 01:00) 8h kol nhar lli machi OFF
                shifts.push("17:00-01:00");
              } else {
                // Shift s-sbah / nhar: Tnin-Khmis (7h: 10-17), Jummu3a-Sabt (8h: 10-18), L-Ḥad (7h: 10-17)
                if (day === 4 || day === 5) {
                  shifts.push("10:00-18:00");
                } else {
                  shifts.push("10:00-17:00");
                }
              }
            } else {
              shifts.push(getShiftForDay(currentShiftType, day));
            }
          }
        }

        return {
          name: a.name,
          zone: currentZone,
          shiftType: currentShiftType,
          shifts: shifts,
          isLeMarche: a.isLeMarche || a.leMarcheModeIndex !== undefined
        };
      });

      planningDB[weekKey] = generated;
      saveDB();
      return generated;
    }

    function renderPlanningTable() {
      const now = new Date();
      const currentMonday = getMonday(now);
      const viewedMonday = new Date(currentMonday);
      viewedMonday.setDate(currentMonday.getDate() + (currentWeekOffset * 7));
      
      const weekNumber = getWeekNumber(viewedMonday);
      const weekKey = getWeekKey(viewedMonday);
      const sunday = new Date(viewedMonday);
      sunday.setDate(viewedMonday.getDate() + 6);

      const isCurrentWeek = currentWeekOffset === 0;
      const isLocked = isCurrentWeek && !manualUnlock;

      const banner = document.getElementById('lock-banner');
      const pill = document.getElementById('lock-status-pill');

      if (isLocked) {
        if(banner) banner.style.display = 'flex';
        if(pill) { pill.className = 'status-pill pill-locked'; pill.innerText = '🔒 Verrouillée'; }
      } else {
        if(banner) banner.style.display = 'none';
        if(pill) { pill.className = 'status-pill pill-unlocked'; pill.innerText = '🔓 Modifiable'; }
      }

      const weekLbl = document.getElementById('current-week-label');
      if (weekLbl) {
        weekLbl.innerText = `Semaine ${weekNumber} (${viewedMonday.toLocaleDateString('fr-FR', {day: '2-digit', month: '2-digit'})} - ${sunday.toLocaleDateString('fr-FR', {day: '2-digit', month: '2-digit', year: 'numeric'})})`;
      }

      renderHeader(viewedMonday);

      const tbody = document.getElementById('planning-body');
      if (!tbody) return;
      tbody.innerHTML = '';

      const agents = getCurrentWeekAgents(weekKey, weekNumber);

      agents.forEach((agent, agentIdx) => {
        const tr = document.createElement('tr');

        let html = `
          <td class="cell-agent">
            <div class="field-box">
              <span class="field-text" title="${agent.name}">${agent.name}</span>
              <button class="btn-edit-small" ${isLocked ? 'disabled' : ''} title="Changer le nom de l'agent" onclick="promptChangeAgent('${weekKey}', ${agentIdx})">✏️</button>
            </div>
          </td>
          <td class="cell-zone">
            <div class="field-box">
              <span class="field-text zone-txt" title="${agent.zone}">${agent.zone}</span>
              <button class="btn-edit-small" ${isLocked ? 'disabled' : ''} title="Changer la zone" onclick="promptChangeZone('${weekKey}', ${agentIdx})">✏️</button>
            </div>
          </td>
        `;

        agent.shifts.forEach((shift, dayIdx) => {
          let shiftClass = 'matin';
          if (shift === 'OFF') shiftClass = 'off';
          else if (shift.startsWith('17:') || shift.startsWith('18:') || shift.startsWith('12:')) shiftClass = 'soir';
          else if (shift.startsWith('15:')) shiftClass = 'aprem';

          let selectOptions = '';
          SHIFT_GROUPS.forEach(grp => {
            selectOptions += `<optgroup label="${grp.label}">`;
            grp.items.forEach(opt => {
              selectOptions += `<option value="${opt}" ${opt === shift ? 'selected' : ''}>${opt}</option>`;
            });
            selectOptions += `</optgroup>`;
          });

          selectOptions += `<optgroup label="✏️ MANUEL"><option value="CUSTOM_MANUAL">Saisir un horaire libre...</option></optgroup>`;

          html += `
            <td>
              <select class="shift-select ${shiftClass}" ${isLocked ? 'disabled' : ''} onchange="handleShiftSelectChange('${weekKey}', ${agentIdx}, ${dayIdx}, this)">
                ${selectOptions}
              </select>
            </td>
          `;
        });

        const totalHours = agent.shifts.reduce((sum, s) => sum + calculateHours(s), 0);
        const isExact44 = totalHours === 44;
        const diff = Math.round((totalHours - 44) * 10) / 10;
        const badgeClass = isExact44 ? 'badge-ok' : 'badge-alert';
        const badgeText = isExact44 ? '44h OK' : (diff > 0 ? `${totalHours}h (+${diff}h)` : `${totalHours}h (${diff}h)`);

        let quickShiftOptions = `
          <option value="" disabled selected>⚡ Shift Ligne</option>
          <optgroup label="☀️ LE MARCHÉ">
            <option value="10:00-17:00">☀️ 10h-17h (7h)</option>
            <option value="10:00-18:00">☀️ 10h-18h (8h)</option>
            <option value="17:00-01:00">🌙 Lil 17h-01h (8h)</option>
          </optgroup>
          <optgroup label="☀️ MATIN">
            <option value="09:00-16:00">☀️ Matin 7h</option>
            <option value="09:00-17:00">☀️ Matin 8h</option>
          </optgroup>
        `;

        html += `
          <td>
            <div class="total-action-box">
              <span class="hours-badge ${badgeClass}">${badgeText}</span>
              <select class="btn-shift-choice" ${isLocked ? 'disabled' : ''} onchange="applyShiftChoice('${weekKey}', ${agentIdx}, this.value)">
                ${quickShiftOptions}
              </select>
            </div>
          </td>
          <td><button class="btn-del" ${isLocked ? 'disabled' : ''} title="Supprimer" onclick="deleteAgent('${weekKey}', ${agentIdx})">✕</button></td>
        `;

        tr.innerHTML = html;
        tbody.appendChild(tr);
      });
    }

    function handleShiftSelectChange(weekKey, agentIdx, dayIdx, selectEl) {
      const val = selectEl.value;
      if (val === "CUSTOM_MANUAL") {
        promptManualShift(weekKey, agentIdx, dayIdx);
      } else {
        updateShift(weekKey, agentIdx, dayIdx, val);
      }
    }

    function promptManualShift(weekKey, agentIdx, dayIdx) {
      const currentVal = planningDB[weekKey][agentIdx].shifts[dayIdx];
      const bodyHTML = `
        <label>Entrer l'horaire manuellement (Ex: 08:00-16:30 ou OFF) :</label>
        <input type="text" id="manual-shift-input" value="${currentVal}" autofocus placeholder="Ex: 09:30-17:30" />
      `;

      openModal("Saisie Horaire Manuel", bodyHTML, () => {
        const val = document.getElementById('manual-shift-input').value;
        if (val && val.trim() !== "") {
          updateShift(weekKey, agentIdx, dayIdx, val.trim().toUpperCase());
        }
      });
    }

    function openModal(title, bodyHTML, onSave) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body-content').innerHTML = bodyHTML;
      const saveBtn = document.getElementById('modal-save-btn');
      
      saveBtn.onclick = () => {
        onSave();
        closeModal();
      };
      
      document.getElementById('planning-custom-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('planning-custom-modal').classList.remove('active');
    }

    function closePlanningModal() {
      closeModal();
    }

    function promptChangeAgent(weekKey, agentIdx) {
      if (currentWeekOffset === 0 && !manualUnlock) return;
      const currentName = planningDB[weekKey][agentIdx].name;
      
      const bodyHTML = `
        <label>Nom de l'agent :</label>
        <input type="text" id="edit-agent-name" value="${currentName}" autofocus />
      `;

      openModal("Modifier Nom Agent", bodyHTML, () => {
        const val = document.getElementById('edit-agent-name').value;
        if (val && val.trim() !== "") {
          planningDB[weekKey][agentIdx].name = val.trim();
          saveDB();
          renderPlanningTable();
        }
      });
    }

    function promptChangeZone(weekKey, agentIdx) {
      if (currentWeekOffset === 0 && !manualUnlock) return;
      const currentZone = planningDB[weekKey][agentIdx].zone;
      
      let options = KNOWN_ZONES.map(z => `<option value="${z}" ${z === currentZone ? 'selected' : ''}>${z}</option>`).join('');
      
      const bodyHTML = `
        <label>Sélectionner une zone prédéfinie :</label>
        <select id="edit-zone-select">${options}</select>
        <label>Ou entrer une nouvelle zone :</label>
        <input type="text" id="edit-zone-custom" placeholder="Autre zone..." />
      `;

      openModal("Modifier Zone", bodyHTML, () => {
        const customVal = document.getElementById('edit-zone-custom').value;
        const selectVal = document.getElementById('edit-zone-select').value;
        const finalZone = (customVal && customVal.trim() !== "") ? customVal.trim() : selectVal;

        if (finalZone) {
          planningDB[weekKey][agentIdx].zone = finalZone;
          saveDB();
          renderPlanningTable();
        }
      });
    }

    function applyShiftChoice(weekKey, agentIdx, shiftVal) {
      if (currentWeekOffset === 0 && !manualUnlock) return;
      const agent = planningDB[weekKey][agentIdx];

      for (let day = 0; day < 7; day++) {
        if (agent.shifts[day] === "OFF") continue;
        agent.shifts[day] = shiftVal;
      }
      saveDB();
      renderPlanningTable();
    }

    function updateShift(weekKey, agentIdx, dayIdx, val) {
      if (currentWeekOffset === 0 && !manualUnlock) return;
      planningDB[weekKey][agentIdx].shifts[dayIdx] = val;
      saveDB();
      renderPlanningTable();
    }

    function changeWeek(direction) {
      currentWeekOffset += direction;
      manualUnlock = false;
      renderPlanningTable();
    }

    function goToCurrentWeek() {
      currentWeekOffset = 0;
      manualUnlock = false;
      renderPlanningTable();
    }

    function forceUnlockCurrentWeek() {
      manualUnlock = true;
      renderPlanningTable();
    }

    function handleAddNewAgent() {
      if (currentWeekOffset === 0 && !manualUnlock) {
        alert("⚠️ Vous êtes sur la semaine en cours verrouillée. Cliquez sur (Suivant ▶) pour préparer la semaine prochaine !");
        return;
      }
      const now = new Date();
      const currentMonday = getMonday(now);
      const viewedMonday = new Date(currentMonday);
      viewedMonday.setDate(currentMonday.getDate() + (currentWeekOffset * 7));
      const weekKey = getWeekKey(viewedMonday);

      if(!planningDB[weekKey]) planningDB[weekKey] = [];

      planningDB[weekKey].push({
        name: "Nouvel Agent",
        zone: "Temara - Oulad Mtaa",
        shiftType: "matin",
        shifts: ["OFF", "10:00-17:00", "10:00-17:00", "10:00-17:00", "10:00-18:00", "10:00-18:00", "17:00-01:00"]
      });
      saveDB();
      renderPlanningTable();
    }

    function deleteAgent(weekKey, idx) {
      if(planningDB[weekKey]) {
        planningDB[weekKey].splice(idx, 1);
        saveDB();
        renderPlanningTable();
      }
    }

    function resetToDefault() {
      localStorage.removeItem('shift_db_le_marche_v3');
      planningDB = {};
      renderPlanningTable();
    }

    function saveDB() {
      localStorage.setItem('shift_db_le_marche_v3', JSON.stringify(planningDB));
    }

    renderPlanningTable();
  </script>
</body>
</html>
